services:
  api:
    build: ./apps/api
    env_file: .env
    environment: { API_HOST: "0.0.0.0", API_PORT: "8000" }
    ports: ["8000:8000"]
    depends_on: { redis: { condition: service_healthy } }
    restart: unless-stopped
  ai-worker:
    build: ./services/ai-worker
    env_file: .env
    depends_on: { redis: { condition: service_healthy } }
    restart: unless-stopped
  media-worker:
    build: ./services/media-worker
    env_file: .env
    depends_on: { redis: { condition: service_healthy } }
    restart: unless-stopped
  render-worker:
    build: { context: ., dockerfile: services/render-worker/Dockerfile }
    env_file: .env
    depends_on: { redis: { condition: service_healthy } }
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server","--appendonly","yes","--save","60","1"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD","redis-cli","ping"], interval: 10s, timeout: 3s, retries: 5 }
    restart: unless-stopped
volumes:
  redis-data:
